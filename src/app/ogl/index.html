<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vercel triangle led</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; touch-action: none; }
  #tabs {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 10;
  }
  .tab {
    padding: 7px 14px; border-radius: 999px; font-size: 12.5px; letter-spacing: .01em;
    color: rgba(255,255,255,.5); background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08); cursor: pointer; user-select: none;
    transition: color .2s ease, background .2s ease, border-color .2s ease;
  }
  .tab:hover { color: rgba(255,255,255,.85); background: rgba(255,255,255,.08); }
  .tab.active {
    color: #fff; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22);
  }
  #hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.28); font-size: 11.5px; letter-spacing: .02em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="tabs">
  <div class="tab active" data-click="-1">Idle</div>
  <div class="tab" data-click="0">Side A</div>
  <div class="tab" data-click="1">Side B</div>
  <div class="tab" data-click="2">Side C</div>
</div>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="hint">click the triangle for the RGB deploy &middot; hover to move the light &middot; tabs isolate an edge</div>

<script type="module">
/* ============================================================================================
 * triangle-led-4 — standalone WebGL2 recreation
 *
 * Ported directly from Vercel's production The GLSL shader strings, the triangle/LED geometry
 * math, the LED-emitter-mesh vertex builder (incl. mitered corner caps), the config-UBO
 * packing, and the "lines" idle-shimmer + "edge" highlight animation curves
 *
 *  - WebGPU renderer path (this always used the WebGL2 path's actual shader source)
 *  - Web Worker / OffscreenCanvas indirection (rendered directly to the visible canvas)
 *  - Light theme variant (dark floor only)
 *  - Drag/drop deploy particle burst + scan/pulse/coding/lines2 LED patterns
 * ========================================================================================== */

// ---------------------------------------------------------------------------------------
// Constants (real defaults config module)
// ---------------------------------------------------------------------------------------
const TRIANGLE_HEIGHT_RATIO = (180 / 630) * 0.8;
const LEDS_PER_EDGE = 24;
const LED_COUNT = 3 * LEDS_PER_EDGE; // 72
const LED_EMITTER_MESH_EXPANSION_PX = 1;
const LED_SDF_CROP_EXPANSION_PX = 2;
const HERO_CANVAS_MAX_CSS = 720;
const NOISE_ROTATION_START_SECONDS = 10;
const BRIGHTNESS_MIN_HOVER_MULTIPLIER = 4;
const BRIGHTNESS_MIN_HOVER_SMOOTHING = 0.2;

const HERO_CAMERA_ZOOM_DESKTOP = 1.3;
const HERO_CAMERA_ZOOM_MOBILE = 1.6;

const DIRECT_TRIANGLE_ABSORPTION = 2;
const DIRECT_TRIANGLE_FALLOFF_POWER = 1;
const DIRECT_TRIANGLE_HIT_THRESHOLD_PX = 0.75;
const DIRECT_TRIANGLE_INTENSITY_SCALE = 50;
const DIRECT_TRIANGLE_MIN_SOURCE_LUMA = 0.001;
const DIRECT_TRIANGLE_MIN_STEP_PX = 1.5;
const DIRECT_TRIANGLE_TARGET_SCALE = 0.5;

const TUNABLE_DEFAULTS = {
  darkFloorAlbedo: 1, lightFloorAlbedo: 1, ledIntensity: 1, noiseScale: 0.01,
  rotationSpeed: -0.2, brightnessMin: 0.09, brightnessMinDark: 0.05,
  brightnessMax: 1, brightnessMaxLight: 1.02, ledHitThreshold: 1,
  ledRaycastClipInsetPx: 2, particleExposureBoostMin: 5.2, particleExposureBoostMax: 60,
  particleSpawnSpread: 118, particleNoiseOffset: 1,
};

const HERO_STATE_MODES = { coding: "coding", scan: "scan", pulse: "pulse", edge: "edge", lines: "lines", lines2: "lines2" };
const HERO_STATE_DEFAULTS = {
  mode: HERO_STATE_MODES.lines, transitionDuration: 0.25,
  edgeIndex: 0, edgeBaseBrightness: 0.05, edgeHighlightBrightness: 0.4,
};

const DEFAULT_BRUSH = {
  radius: 28, friction: 5, colour: { r: 1, g: 1, b: 1 },
  glowEnabled: true, glowRadius: 165, glowStrength: 1, glowSmoothing: 0.23,
  glowFacingEnabled: true, glowFacingFullDeg: 90, glowFacingZeroDeg: 100,
  linesFadeDistance: 0.6,
};

const LIGHT_AO_DEFAULTS = { radiance: 0.07, contactOpacity: 0.1, contactSize: 3, contactFalloffPower: 1.6, highlightPower: 0.7, highlightStrength: 1.25 };
const RADIANCE_DEBUG_DEFAULTS = { enabled: false, redMultiplier: 1, greenMultiplier: 1, blueMultiplier: 1 };
const DARK_FLOOR_DEFAULTS = {
  sdfFadeDistanceScale: 0.75, sdfFadeEdgePx: 0, nearFalloffPower: 4,
  nearFalloffDistanceScale: 0.046, nearFalloffIntensity: 1.2, nearFalloffMapMin: 2.74, nearFalloffMapMax: 5,
  middleFalloffPower: 1, middleFalloffIntensity: 0.16,
  tailIntensity: 0.65, tailMapMin: 0, tailMapMax: 8.85, tailPower: 0.05,
  nearFalloffEnabled: true, middleFalloffEnabled: false, farFalloffEnabled: true,
  noiseEnabled: true, radianceJitterPx: 16, vibrancy: 2,
};
const DARK_POSTPROCESS_DEFAULTS = { contrast: 1.05, exposure: 0.25 };
const HOVER_RGB_TINT_DEFAULTS = {
  enabled: true, amount: 1, radius: 173, power: 3, responseSmoothing: 0.2, deployDurationSeconds: 0.5,
  noiseBrightnessMin: 0.3, noiseBrightnessMax: 10, noiseBrightnessPower: 2,
  edgeRedLinear: { r: 0.896269, g: 0.027321, b: 0.051269 },
  edgeGreenLinear: { r: 0, g: 0.40724, b: 0.048172 },
  edgeBlueLinear: { r: 0, g: 0.278894, b: 1 },
  edgeOverlap: 1,
};

const EDGE_INDEX_REMAP = [0, 2, 1]; // maps tab (0,1,2) -> geometric edge index

function heroStateForActiveClick(activeClick) {
  if (activeClick === 0 || activeClick === 1 || activeClick === 2) {
    return { mode: HERO_STATE_MODES.edge, edgeIndex: EDGE_INDEX_REMAP[activeClick] };
  }
  return { mode: HERO_STATE_MODES.lines, edgeIndex: HERO_STATE_DEFAULTS.edgeIndex };
}

// ---------------------------------------------------------------------------------------
// Triangle / LED geometry (ported from canonicalTriangleGeometry, triangleLedRadius,
// triangleLedShapeDimensions, triangleEdgeLedLayout, ledMeshGeometry, triangleAnchorIndices)
// ---------------------------------------------------------------------------------------
let heroSceneScale = 1;
function setHeroSceneScale(v) { heroSceneScale = Number.isFinite(v) && v > 0 ? v : 1; }
function resolveHeroSceneScale(zoom, cssHeight, mobile) {
  return mobile || !Number.isFinite(cssHeight) || cssHeight <= 0 ? zoom : zoom * Math.min(1, 560 / cssHeight);
}

function canonicalTriangleGeometry(dims) {
  const height = dims.height * TRIANGLE_HEIGHT_RATIO * heroSceneScale;
  const circumradius = (2 * height) / 3;
  const inradius = height / 3;
  const sideLength = (2 * height) / Math.sqrt(3);
  const cx = 0.5 * dims.width, cy = 0.5 * dims.height;
  return {
    center: { x: cx, y: cy },
    top: { x: cx, y: cy - circumradius },
    left: { x: cx - 0.5 * sideLength, y: cy + inradius },
    right: { x: cx + 0.5 * sideLength, y: cy + inradius },
    height, circumradius, inradius, sideLength,
  };
}
function triangleLedRadius(dims) { return 0.0236 * canonicalTriangleGeometry(dims).height; }
function triangleLedShapeDimensions(dims, ledsPerEdge) {
  const geo = canonicalTriangleGeometry(dims);
  const radius = triangleLedRadius(dims);
  const cornerTrim = Math.min(2 * radius * Math.sqrt(3) + 1, 0.45 * geo.sideLength);
  const centerSpacing = Math.max(0, geo.sideLength - 2 * cornerTrim) / Math.max(1, ledsPerEdge);
  return {
    normalHalfThickness: 2 * radius,
    tangentHalfLength: Math.max(0, 0.5 * centerSpacing - 0.5),
    cornerTrim, centerSpacing,
  };
}
function scaleTriangleGeometry(geo, scale) {
  const c = geo.center;
  const s = (p) => ({ x: c.x + (p.x - c.x) * scale, y: c.y + (p.y - c.y) * scale });
  return {
    center: c, top: s(geo.top), left: s(geo.left), right: s(geo.right),
    height: geo.height * scale, circumradius: geo.circumradius * scale,
    inradius: geo.inradius * scale, sideLength: geo.sideLength * scale,
  };
}
function marginFraction(geo) {
  const refH = 720 * TRIANGLE_HEIGHT_RATIO;
  const n = (5 * Math.min(geo.height, refH)) / refH;
  return geo.inradius > n ? (geo.inradius - n) / geo.inradius : 1;
}
function ledMeshGeometry(dims) {
  const geo = canonicalTriangleGeometry(dims);
  return scaleTriangleGeometry(geo, marginFraction(geo));
}
function triangleEdgeLedLayout(dims, ledsPerEdge) {
  const geo = canonicalTriangleGeometry(dims);
  const frac = marginFraction(geo);
  const inner = scaleTriangleGeometry(geo, frac);
  const { top, left, right, center } = inner;
  const shrunkDims = { width: dims.width, height: dims.height * frac };
  const shape = triangleLedShapeDimensions(shrunkDims, ledsPerEdge);
  const positions = [];
  for (const [a, b] of [[top, left], [left, right], [right, top]]) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx);
    const trimT = len > 0 ? shape.cornerTrim / len : 0;
    const spacingT = len > 0 ? shape.centerSpacing / len : 0;
    for (let i = 0; i < ledsPerEdge; i++) {
      const t = trimT + (i + 0.5) * spacingT;
      positions.push({ x: a.x + dx * t, y: a.y + dy * t, angle });
    }
  }
  return { center, positions, geometry: inner, ledRadius: triangleLedRadius(shrunkDims), ledShape: shape };
}

// ---------------------------------------------------------------------------------------
// LED emitter mesh vertex builder (mitered corner caps) — ported
// ---------------------------------------------------------------------------------------
function dirNormal(angle) {
  const d = { x: Math.cos(angle), y: Math.sin(angle) };
  return { dir: d, normal: { x: -d.y, y: d.x } };
}
function offsetPoint(p, dirVec, amount) { return { x: p.x + dirVec.x * amount, y: p.y + dirVec.y * amount, n: amount }; }
function sqDist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }
function farther(a, b, ref) { return sqDist(a, ref) >= sqDist(b, ref) ? a : b; }
function lineIntersect(p0, d0, p1, d1) {
  const r = d0.x * d1.y - d0.y * d1.x;
  if (Math.abs(r) < 1e-6) return undefined;
  const t = ((p1.x - p0.x) * d1.y - (p1.y - p0.y) * d1.x) / r;
  return { x: p0.x + d0.x * t, y: p0.y + d0.y * t };
}
function buildLedEmitterVertices(dims, expansionPx) {
  const layout = triangleEdgeLedLayout(dims, LEDS_PER_EDGE);
  const { tangentHalfLength: r0, normalHalfThickness: n0 } = layout.ledShape;
  const c = r0 + expansionPx, d = n0 + expansionPx;
  const out = [];
  const push = (ledIdx, x, y, tangent, normal) => out.push(x, y, tangent, normal, ledIdx, 0);
  const quad = (ledIdx, center, dir, normal, tMin, tMax, nMin, nMax) => {
    const corners = [{ t: tMin, n: nMin }, { t: tMax, n: nMin }, { t: tMax, n: nMax }, { t: tMin, n: nMax }];
    for (const idx of [0, 1, 2, 0, 2, 3]) {
      const p = corners[idx];
      push(ledIdx, center.x + dir.x * p.t + normal.x * p.n, center.y + dir.y * p.t + normal.y * p.n, p.t, p.n);
    }
  };
  layout.positions.forEach((pos, ledIdx) => {
    const { dir, normal } = dirNormal(pos.angle || 0);
    quad(ledIdx, pos, dir, normal, -c, c, -d, d);
  });

  const vertices = [layout.geometry.top, layout.geometry.left, layout.geometry.right];
  for (let e = 0; e < 3; e++) {
    const prevIdx = ((e + 2) % 3) * LEDS_PER_EDGE + LEDS_PER_EDGE - 1;
    const nextIdx = e * LEDS_PER_EDGE;
    const prevLed = layout.positions[prevIdx], nextLed = layout.positions[nextIdx], vertex = vertices[e];
    if (!prevLed || !nextLed || !vertex) continue;
    const prevDN = dirNormal(prevLed.angle || 0), nextDN = dirNormal(nextLed.angle || 0);
    const S = { x: prevLed.x + prevDN.dir.x * c, y: prevLed.y + prevDN.dir.y * c };
    const M = { x: nextLed.x - nextDN.dir.x * c, y: nextLed.y - nextDN.dir.y * c };
    let bx = S.x + M.x - 2 * vertex.x, by = S.y + M.y - 2 * vertex.y;
    const blen = Math.hypot(bx, by);
    const bisector = blen <= 0 ? { x: 0, y: 0 } : { x: bx / blen, y: by / blen };
    const apex = { x: vertex.x + bisector.x * (layout.ledShape.cornerTrim + c), y: vertex.y + bisector.y * (layout.ledShape.cornerTrim + c) };
    const xCorner = farther(offsetPoint(S, prevDN.normal, -d), offsetPoint(S, prevDN.normal, d), M);
    const yCorner = farther(offsetPoint(M, nextDN.normal, -d), offsetPoint(M, nextDN.normal, d), S);
    const apexInter = lineIntersect(xCorner, prevDN.dir, yCorner, nextDN.dir) ?? vertex;
    const trim = layout.ledShape.cornerTrim;
    push(prevIdx, apexInter.x, apexInter.y, trim, 0);
    push(prevIdx, xCorner.x, xCorner.y, c, xCorner.n);
    push(prevIdx, apex.x, apex.y, trim, 0);
    push(nextIdx, apexInter.x, apexInter.y, -trim, 0);
    push(nextIdx, apex.x, apex.y, -trim, 0);
    push(nextIdx, yCorner.x, yCorner.y, -c, yCorner.n);
  }
  return new Float32Array(out);
}

// ---------------------------------------------------------------------------------------
// LED animation state — "lines" idle shimmer + "edge" highlight + brush glow + RGB deploy
// (ported from computeLeds() / K())
// ---------------------------------------------------------------------------------------
const LINE_CENTERS_DEFAULT = [6, 6, 6];
const LINE_VELOCITIES_DEFAULT = [-3.302, -2.355, -1.636];
const LINES_FREQ = [0.41, 0.31, 0.23], LINES_PHASE = [0, 2.1, 4.2];
const LINES_WFREQ = [0.52, 0.38, 0.28], LINES_WPHASE = [Math.PI / 2, 0.4, -0.6];
const LEN_LO = LEDS_PER_EDGE, LEN_HI = 1.7 * LEDS_PER_EDGE;
const LEN_MID = (LEN_LO + LEN_HI) / 2, LEN_SPAN = (LEN_HI - LEN_LO) / 2;

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function wrapLed(v) { return ((v % LED_COUNT) + LED_COUNT) % LED_COUNT; }
function wrapDelta(a, b) { return (((a - b) % LED_COUNT) + LED_COUNT + LED_COUNT / 2) % LED_COUNT - LED_COUNT / 2; }
function midpoint(a, b) { return { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 }; }
function glowKernel(px, py, ex, ey, radius, power) { return Math.pow(1 / (1 + Math.hypot(px - ex, py - ey) / radius), power); }

function createLedState(dims) {
  const layout = triangleEdgeLedLayout(dims, LEDS_PER_EDGE);
  const data = new Float32Array(8 * layout.positions.length);
  const normals = new Float32Array(2 * layout.positions.length);
  layout.positions.forEach((p, i) => {
    const o = 8 * i;
    data[o + 0] = p.x; data[o + 1] = p.y; data[o + 2] = 0; data[o + 3] = p.angle || 0;
    data[o + 4] = 1; data[o + 5] = 1; data[o + 6] = 1; data[o + 7] = 0;
    let nx = -Math.sin(p.angle || 0), ny = Math.cos(p.angle || 0);
    const cx = p.x - layout.center.x, cy = p.y - layout.center.y;
    if (nx * cx + ny * cy < 0) { nx = -nx; ny = -ny; }
    normals[2 * i] = nx; normals[2 * i + 1] = ny;
  });
  return {
    data, currentState: data.slice(), targetState: data.slice(), deployingState: data.slice(),
    center: layout.center,
    deployEdgeCenters: [midpoint(layout.geometry.top, layout.geometry.left), midpoint(layout.geometry.left, layout.geometry.right), midpoint(layout.geometry.right, layout.geometry.top)],
    triangleVertices: [layout.geometry.top, layout.geometry.left, layout.geometry.right],
    normals,
    lastMode: undefined, lastEdgeIndex: undefined, transitionStart: 0, transitionDuration: 0, transitionActive: false,
    animationClock: NOISE_ROTATION_START_SECONDS, lastFrameTime: undefined,
    lineCenters: Float32Array.from(LINE_CENTERS_DEFAULT), lineVelocities: Float32Array.from(LINE_VELOCITIES_DEFAULT),
    glowState: new Float32Array(LED_COUNT), glowDecaying: false,
    hoverTransition: 0, hoverActive: false,
  };
}

function setLed(arr, idx, brightness, r, g, b) {
  const o = 8 * idx; arr[o + 2] = brightness; arr[o + 4] = r; arr[o + 5] = g; arr[o + 6] = b;
}

function computeLinesMode(state, target, animClock, dt) {
  for (let i = 0; i < 3; i++) state.lineCenters[i] = wrapLed((state.lineCenters[i] || 0) + (state.lineVelocities[i] || 0) * dt);
  const l = animClock - NOISE_ROTATION_START_SECONDS;
  const outerLen = [], innerLen = [], amp = [];
  for (let e = 0; e < 3; e++) {
    const len = Math.max(1, 0.5 * (LEN_MID + LEN_SPAN * Math.sin(l * LINES_FREQ[e] + LINES_PHASE[e])));
    outerLen[e] = len; innerLen[e] = 0.5 * len;
    amp[e] = 0.5 + 0.5 * Math.sin(l * LINES_WFREQ[e] + LINES_WPHASE[e]);
  }
  for (let i = 0; i < LED_COUNT; i++) {
    let r = 0;
    for (let e = 0; e < 3; e++) {
      const dist = Math.abs(wrapDelta(i, state.lineCenters[e] || 0));
      const shaped = dist <= innerLen[e] ? 1 : clamp01(1 - (dist - innerLen[e]) / (outerLen[e] - innerLen[e]));
      r = Math.max(r, shaped * amp[e]);
    }
    setLed(target, i, clamp01(r), 1, 1, 1);
  }
}

function computeEdgeMode(target, edgeIndex, brightnessMin, highlightBrightness, colorMix) {
  const lo = edgeIndex * LEDS_PER_EDGE, hi = lo + LEDS_PER_EDGE;
  const base = clamp01(0.125 * brightnessMin * (1 - 0.8 * colorMix));
  const highlight = clamp01(highlightBrightness * (1 + 2 * colorMix));
  for (let i = 0; i < LED_COUNT; i++) setLed(target, i, i >= lo && i < hi ? highlight : base, 1, 1, 1);
}

function computeDeployTint(state, out, tint) {
  out.set(state.data);
  const amount = clamp01(tint?.amount ?? 1);
  const radius = Math.max(tint?.radius ?? 1, 1);
  const power = Math.max(tint?.power ?? 1, 0.001);
  const red = tint?.edgeRedLinear ?? HOVER_RGB_TINT_DEFAULTS.edgeRedLinear;
  const green = tint?.edgeGreenLinear ?? HOVER_RGB_TINT_DEFAULTS.edgeGreenLinear;
  const blue = tint?.edgeBlueLinear ?? HOVER_RGB_TINT_DEFAULTS.edgeBlueLinear;
  const invOverlap = 1 / Math.max(tint?.edgeOverlap ?? 1, 0.01);
  for (let i = 0; i < LED_COUNT; i++) {
    const o = 8 * i, x = state.data[o], y = state.data[o + 1];
    const [ec0, ec1, ec2] = state.deployEdgeCenters;
    const wr = Math.pow(glowKernel(x, y, ec0.x, ec0.y, radius, power), invOverlap);
    const wg = Math.pow(glowKernel(x, y, ec1.x, ec1.y, radius, power), invOverlap);
    const wb = Math.pow(glowKernel(x, y, ec2.x, ec2.y, radius, power), invOverlap);
    const wsum = Math.max(wr + wg + wb, 1e-4);
    let r = (red.r * wr + green.r * wg + blue.r * wb) / wsum;
    let g = (red.g * wr + green.g * wg + blue.g * wb) / wsum;
    let b = (red.b * wr + green.b * wg + blue.b * wb) / wsum;
    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    if (luma > 1e-4) { const inv = 1 / luma; r *= inv; g *= inv; b *= inv; }
    setLed(out, i, out[o + 2], lerp(1, r, amount), lerp(1, g, amount), lerp(1, b, amount));
  }
}

function stepEaseInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function computeLeds(state, time, tunables, hero, hoverDeploy, brush) {
  const eo = state.lastFrameTime === undefined;
  const dt = eo ? 0 : Math.max(0, Math.min(time - state.lastFrameTime, 0.1));
  state.lastFrameTime = time;
  const speedup = dt * (1 + 9 * Math.sin(clamp01(hoverDeploy?.factor ?? 0) * Math.PI));
  if (eo) state.animationClock = NOISE_ROTATION_START_SECONDS;
  state.animationClock += speedup;

  const edgeIndex = Number.isFinite(hero.edgeIndex) ? Math.max(0, Math.min(2, Math.round(hero.edgeIndex))) : 0;
  const edgeChanged = hero.mode === HERO_STATE_MODES.edge && state.lastEdgeIndex !== undefined && edgeIndex !== state.lastEdgeIndex;
  if (state.lastMode === undefined) { state.lastMode = hero.mode; state.lastEdgeIndex = edgeIndex; state.transitionActive = false; }
  else if (hero.mode !== state.lastMode || edgeChanged) {
    state.currentState.set(state.data);
    state.transitionStart = time; state.transitionDuration = Math.max(0, hero.transitionDuration);
    state.transitionActive = state.transitionDuration > 0;
    state.lastMode = hero.mode; state.lastEdgeIndex = edgeIndex;
  }

  const colorMix = clamp01(hoverDeploy?.factor ?? 0);
  if (hero.mode === HERO_STATE_MODES.edge) computeEdgeMode(state.targetState, edgeIndex, tunables.brightnessMin, hero.edgeHighlightBrightness, colorMix);
  else computeLinesMode(state, state.targetState, state.animationClock, speedup);

  // linesFadeDistance: fade the pattern when the pointer sits far outside the triangle
  const linesFade = (hero.mode === HERO_STATE_MODES.lines) && (brush?.linesFadeDistance ?? 0) > 0;
  let hoverFactor = 0;
  if (linesFade) {
    let active = 0;
    if (brush?.active === true && brush?.isMouse === true && brush?.inside !== true) {
      const [A, B, C] = state.triangleVertices;
      const px = brush.x, py = brush.y;
      const distToSeg = (p1, p2) => {
        const vx = p2.x - p1.x, vy = p2.y - p1.y;
        const t = clamp01(((px - p1.x) * vx + (py - p1.y) * vy) / (vx * vx + vy * vy || 1));
        const dx = px - (p1.x + vx * t), dy = py - (p1.y + vy * t);
        return Math.hypot(dx, dy);
      };
      const dist = Math.min(distToSeg(A, B), distToSeg(B, C), distToSeg(C, A));
      const threshold = (brush.linesFadeDistance ?? 0) * (state.__triHeight ?? 400);
      if (!state.hoverActive && dist < threshold) state.hoverActive = true;
      else if (state.hoverActive && dist > 1.2 * threshold) state.hoverActive = false;
      active = state.hoverActive ? 1 : 0;
    } else state.hoverActive = false;
    if (state.hoverTransition > 1e-4 || active > 0) {
      const k = 1 - Math.exp(-dt / 0.3);
      state.hoverTransition += (active - state.hoverTransition) * k;
    }
    hoverFactor = clamp01(state.hoverTransition);

function pointerToBrush(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = simDims.width / rect.width, scaleY = simDims.height / rect.height;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}
function pointInsideTriangle(px, py, geo) {
  const s = (a, b, p) => (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);
  const s0 = s(geo.top, geo.left, { x: px, y: py });
  const s1 = s(geo.left, geo.right, { x: px, y: py });
  const s2 = s(geo.right, geo.top, { x: px, y: py });
  return (s0 <= 0 && s1 <= 0 && s2 <= 0) || (s0 >= 0 && s1 >= 0 && s2 >= 0);
}

canvas.addEventListener("pointermove", (e) => {
  const p = pointerToBrush(e.clientX, e.clientY);
  const geo = canonicalTriangleGeometry(simDims);
  brush = { ...DEFAULT_BRUSH, x: p.x, y: p.y, active: true, isMouse: e.pointerType !== "touch", inside: pointInsideTriangle(p.x, p.y, geo) };
});
canvas.addEventListener("pointerleave", () => { brush = { ...DEFAULT_BRUSH, x: -1e4, y: -1e4, active: false, inside: false, isMouse: false }; });

  // bleeds off the edge rather than hitting a visible cutoff; only height is capped.
  cssWidth = Math.max(64, Math.round(box.width));
  cssHeight = Math.max(64, Math.round(Math.min(box.height, HERO_CANVAS_MAX_CSS)));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = cssWidth + "px";
  canvas.style.height = cssHeight + "px";
  const pixelW = Math.max(1, Math.round(cssWidth * dpr));
  const pixelH = Math.max(1, Math.round(cssHeight * dpr));
  canvas.width = pixelW; canvas.height = pixelH;

  const mobile = box.width < 640;
  setHeroSceneScale(resolveHeroSceneScale(mobile ? HERO_CAMERA_ZOOM_MOBILE : HERO_CAMERA_ZOOM_DESKTOP, cssHeight, mobile));

  const simFloor = Math.max(1, 360 / Math.max(1, cssHeight)); // simulationFloorFactor
  resizeSimulation({ width: Math.round(cssWidth * simFloor), height: Math.round(cssHeight * simFloor) });
}
window.addEventListener("resize", handleResize);
handleResize();

// ---------------------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------------------
let startTime = performance.now();

function step(nowMs) {
  const time = (nowMs - startTime) / 1000;

  // click-toggle rgbDeployActive -> exponential smoothing (deployDurationSeconds)
  const target = rgbDeployActive ? 1 : 0;
  if (!hoverDeployState.started) { hoverDeployState.started = true; hoverDeployState.lastTime = time; hoverDeployState.value = target; }
  const dt = Math.min(0.25, Math.max(0, time - hoverDeployState.lastTime));
  hoverDeployState.lastTime = time;
  const tau = HOVER_RGB_TINT_DEFAULTS.deployDurationSeconds;
  const k = tau > 0 ? 1 - Math.exp(-dt / tau) : 1;
  hoverDeployState.value += (target - hoverDeployState.value) * k;
  if (Math.abs(target - hoverDeployState.value) < 1e-4) hoverDeployState.value = target;

  const clickState = heroStateForActiveClick(activeClick);
  const hero = { ...HERO_STATE_DEFAULTS, ...clickState };

  const tunables = { ...TUNABLE_DEFAULTS, brightnessMin: TUNABLE_DEFAULTS.brightnessMinDark };

  computeLeds(ledState, time, tunables, hero, { factor: hoverDeployState.value, tint: HOVER_RGB_TINT_DEFAULTS }, brush);
  uploadLedTexture(ledState.data);

  renderFrame(tunables);
  requestAnimationFrame(step);
}

function renderFrame(tunables) {
  const dims = simDims;
  const geo = canonicalTriangleGeometry(dims);
  const ledRadius = triangleLedRadius(dims);
  const shape = triangleLedShapeDimensions(dims, LEDS_PER_EDGE);

  // --- Pass 1: light sources (SDF prepass + LED emitter mesh) ---
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.SCISSOR_TEST);
  gl.bindVertexArray(fullscreenVao);
  gl.bindFramebuffer(gl.FRAMEBUFFER, lightSourcesRT.framebuffer);
  gl.viewport(0, 0, lightSourcesRT.width, lightSourcesRT.height);

  const cfg = new Float32Array(28);
  cfg.set([dims.width, dims.height, 0, tunables.darkFloorAlbedo], 0);
  cfg.set([brush.x, brush.y, brush.active ? 1 : 0, brush.radius], 4);
  cfg.set([brush.colour.r, brush.colour.g, brush.colour.b, 0], 8);
  cfg.set([tunables.ledIntensity, tunables.brightnessMin, tunables.brightnessMax, ledRadius], 12);
  cfg.set([geo.center.x, geo.center.y, geo.circumradius, 0.5 * geo.sideLength], 16);
  const clipInset = Math.min(8, Math.max(-4, tunables.ledRaycastClipInsetPx));
  cfg.set([1, tunables.ledHitThreshold, shape.tangentHalfLength, shape.normalHalfThickness], 20);
  cfg.set([LED_SDF_CROP_EXPANSION_PX, clipInset, 0, 0], 24);
  writeUBO(configUbo, cfg);
  bindUBOBase(0, configUbo);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ledTexture);

  const bakeKey = `1:${clipInset}`;
  if (lightSourcesBakeKey !== bakeKey) {
    lightSourcesBakeKey = bakeKey;
    gl.disable(gl.BLEND); gl.colorMask(true, true, true, true);
    gl.clearColor(0, 0, 0, 1000); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(lightSourcesProgram);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.useProgram(ledEmitterProgram);
  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.ONE, gl.ZERO, gl.ONE, gl.ONE);
  gl.blendEquationSeparate(gl.FUNC_ADD, gl.MIN);
  gl.colorMask(true, true, true, false);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ledTexture);
  gl.bindVertexArray(ledVao);
  gl.drawArrays(gl.TRIANGLES, 0, ledVertexCount);
  gl.bindVertexArray(fullscreenVao);
  gl.disable(gl.BLEND); gl.colorMask(true, true, true, true);

  // --- Pass 2: direct raycast (half-res radiance) ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, directRaycastRT.framebuffer);
  gl.viewport(0, 0, directRaycastRT.width, directRaycastRT.height);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(directRaycastProgram);
  bindUBOBase(0, directRaycastUbo);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, lightSourcesRT.texture);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // --- Pass 3: dark floor, straight to the canvas backbuffer ---
  const presW = canvas.width, presH = canvas.height;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, presW, presH);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(darkFloorProgram);

  const scale = Math.max(0.001, presH / Math.max(1, dims.height));
  const originX = (presW - dims.width * scale) * 0.5;
  const originY = (presH - dims.height * scale) * 0.5;
  const screenGeo = {
    centerX: originX + geo.center.x * scale, centerY: originY + geo.center.y * scale,
    circumradiusY: geo.circumradius * scale, halfSideX: 0.5 * geo.sideLength * scale,
  };
  const edgeFadeFrac = 0.2;
  const N = new Float32Array(64);
  N.set([presW, presH, 0, dpr], 0);
  N.set([dims.width, dims.height, 0, 0], 4); // dark: contactOpacity=0
  N.set([tunables.ledIntensity, tunables.darkFloorAlbedo, LIGHT_AO_DEFAULTS.radiance, 0], 8);
  N.set([screenGeo.centerX, screenGeo.centerY, screenGeo.circumradiusY, screenGeo.halfSideX], 12);
  N.set([0, 0, 1, TUNABLE_DEFAULTS.particleExposureBoostMax], 16);
  N.set([originX, originY, dims.width * scale, dims.height * scale], 20);
  N.set([LIGHT_AO_DEFAULTS.contactFalloffPower, LIGHT_AO_DEFAULTS.highlightPower, LIGHT_AO_DEFAULTS.highlightStrength, 0], 24);
  N.set([RADIANCE_DEBUG_DEFAULTS.enabled ? 1 : 0, RADIANCE_DEBUG_DEFAULTS.redMultiplier, RADIANCE_DEBUG_DEFAULTS.greenMultiplier, RADIANCE_DEBUG_DEFAULTS.blueMultiplier], 28);
  N.set([originX, originY, scale, edgeFadeFrac], 32);
  N.set([DARK_FLOOR_DEFAULTS.sdfFadeDistanceScale, DARK_FLOOR_DEFAULTS.sdfFadeEdgePx, DARK_FLOOR_DEFAULTS.nearFalloffPower, DARK_FLOOR_DEFAULTS.tailPower], 36);
  N.set([DARK_FLOOR_DEFAULTS.tailIntensity, DARK_FLOOR_DEFAULTS.vibrancy, DARK_FLOOR_DEFAULTS.tailMapMin, DARK_FLOOR_DEFAULTS.tailMapMax], 40);
  N.set([DARK_FLOOR_DEFAULTS.nearFalloffDistanceScale, DARK_FLOOR_DEFAULTS.nearFalloffIntensity, DARK_FLOOR_DEFAULTS.nearFalloffMapMin, DARK_FLOOR_DEFAULTS.nearFalloffMapMax], 44);
  const jitterW = HERO_CANVAS_MAX_CSS * Math.max(dpr, 1e-4);
  const jitterNorm = Math.min(presH, jitterW) / jitterW;
  N.set([DARK_FLOOR_DEFAULTS.middleFalloffPower, DARK_FLOOR_DEFAULTS.middleFalloffIntensity, DARK_FLOOR_DEFAULTS.radianceJitterPx, jitterNorm], 48);
  N.set([DARK_FLOOR_DEFAULTS.nearFalloffEnabled ? 1 : 0, DARK_FLOOR_DEFAULTS.middleFalloffEnabled ? 1 : 0, DARK_FLOOR_DEFAULTS.farFalloffEnabled ? 1 : 0, DARK_POSTPROCESS_DEFAULTS.contrast], 52);
  N.set([edgeFadeFrac, DARK_POSTPROCESS_DEFAULTS.exposure, 0, 0], 56);
  N.set([DARK_FLOOR_DEFAULTS.noiseEnabled ? 1 : 0, 0, 0, 0], 60);
  writeUBO(floorUbo, N);
  bindUBOBase(0, floorUbo);

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, directRaycastRT.texture);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, lightSourcesRT.texture);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, floorNoise);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, ensureParticleTex(presW, presH));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindVertexArray(null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

requestAnimationFrame(step);
</script>
